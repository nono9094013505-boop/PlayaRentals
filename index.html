<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Beach Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#EDE3CE;
    --sand-deep:#E2D4B4;
    --teal:#0E5C63;
    --teal-deep:#0A4348;
    --coral:#E9633B;
    --ink:#1F2A28;
    --sun:#F4B740;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(244,183,64,0.35), transparent 40%),
      radial-gradient(circle at 90% 0%, rgba(14,92,99,0.12), transparent 45%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:100px;
  }
  header{
    padding:28px 20px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    color:var(--teal-deep);
    line-height:1.1;
  }
  .brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--teal);
    margin-top:2px;
  }
  .lang-toggle{
    display:flex;
    background:var(--white);
    border-radius:999px;
    padding:4px;
    box-shadow:0 2px 8px rgba(31,42,40,0.08);
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    padding:8px 14px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--teal);
    cursor:pointer;
  }
  .lang-toggle button.active{
    background:var(--teal);
    color:var(--white);
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:0 20px;
  }
  .section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    color:var(--teal-deep);
    margin:28px 0 12px;
  }
  .card{
    background:var(--white);
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 16px rgba(31,42,40,0.06);
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid #F0E9D8;
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{font-weight:600;font-size:15px;}
  .item-price{font-size:13px;color:#6B7B78;margin-top:2px;}
  .qty-control{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .qty-btn{
    width:36px;height:36px;
    border-radius:10px;
    border:none;
    background:var(--sand-deep);
    color:var(--teal-deep);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .qty-btn:active{background:var(--teal);color:var(--white);}
  .qty-num{
    min-width:20px;
    text-align:center;
    font-weight:700;
    font-size:16px;
  }
  .map-wrap{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    aspect-ratio:4/3;
    background:#DCEFEE;
  }
  .map-hint{
    position:absolute;
    bottom:10px;left:10px;right:10px;
    background:rgba(31,42,40,0.65);
    color:var(--white);
    font-size:12px;
    padding:8px 12px;
    border-radius:10px;
    text-align:center;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 2px 14px;
  }
  .toggle-row .label{font-weight:600;font-size:15px;}
  .switch{
    position:relative;width:48px;height:28px;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;inset:0;
    background:#D9CFB6;
    border-radius:999px;
    cursor:pointer;
    transition:0.2s;
  }
  .slider:before{
    content:"";
    position:absolute;
    height:22px;width:22px;
    left:3px;top:3px;
    background:var(--white);
    border-radius:50%;
    transition:0.2s;
  }
  input:checked + .slider{background:var(--teal);}
  input:checked + .slider:before{transform:translateX(20px);}
  #preorderFields{
    display:none;
    padding-top:6px;
  }
  .hours-row{
    display:flex;align-items:center;gap:12px;
  }
  input[type="range"]{
    flex:1;
    accent-color:var(--teal);
  }
  #hoursLabel{font-weight:700;min-width:70px;text-align:right;font-size:14px;}
  .submit-bar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--white);
    box-shadow:0 -4px 20px rgba(31,42,40,0.1);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .submit-bar-inner{
    max-width:520px;margin:0 auto;
    display:flex;align-items:center;gap:14px;
  }
  .total{
    flex-shrink:0;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    color:var(--teal-deep);
  }
  #submitBtn{
    flex:1;
    background:var(--coral);
    color:var(--white);
    border:none;
    border-radius:14px;
    padding:16px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
  }
  #submitBtn:disabled{background:#D9B3A4;cursor:not-allowed;}
  .confirm{
    display:none;
    text-align:center;
    padding:60px 20px;
  }
  .confirm .check{
    width:64px;height:64px;
    border-radius:50%;
    background:var(--teal);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
  }
  .confirm h2{
    font-family:'Fraunces',serif;
    color:var(--teal-deep);
    font-size:24px;
  }
  .confirm p{color:#5C6B68;font-size:15px;line-height:1.5;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="brand" id="brandText">Beach Order<small id="brandSub">Skip the walk-up — order from your spot</small></div>
  <div class="lang-toggle">
    <button id="btnEN" class="active" onclick="setLang('en')">EN</button>
    <button id="btnES" onclick="setLang('es')">ES</button>
  </div>
</header>

<main>
  <div id="orderView">
    <div class="section-title" data-t="whatDoYouWant">What would you like?</div>
    <div class="card" id="itemsList"><!-- items injected here --></div>

    <div class="section-title" data-t="whereAreYou">Where are you?</div>
    <div class="map-wrap" id="mapWrap">
      <div id="leafletMap" style="width:100%;height:100%;"></div>
      <div class="map-hint" data-t="tapMap">Tap where you're sitting</div>
    </div>

    <div class="section-title" data-t="whenTitle">When?</div>
    <div class="card">
      <div class="toggle-row">
        <div class="label" data-t="preorderLabel">Order for later today</div>
        <label class="switch">
          <input type="checkbox" id="preorderToggle" onchange="togglePreorder()">
          <span class="slider"></span>
        </label>
      </div>
      <div id="preorderFields">
        <div class="hours-row">
          <input type="range" id="hoursSlider" min="1" max="8" step="1" value="2" oninput="updateHours()">
          <span id="hoursLabel">2 hrs</span>
        </div>
      </div>
    </div>
  </div>

  <div class="confirm" id="confirmView">
    <div class="check">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 data-t="confirmTitle">Order sent!</h2>
    <p data-t="confirmBody">Someone will bring your order to your spot shortly.</p>
  </div>
</main>

<div class="submit-bar" id="submitBar">
  <div class="submit-bar-inner">
    <div class="total" id="totalDisplay">$0</div>
    <button id="submitBtn" onclick="submitOrder()" disabled data-t="submitBtn">Pick a spot on the map</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- CONFIGURE THESE TWO VALUES from your Supabase project settings ----
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
// --------------------------------------------------------------------

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let lang = 'en';
let items = [];
let qtys = {};
let mapLat = null, mapLng = null;
let isPreorder = false;
let lmap, lmarker;

const dict = {
  en: {
    brand: "Beach Order",
    brandSub: "Skip the walk-up — order from your spot",
    whatDoYouWant: "What would you like?",
    whereAreYou: "Where are you?",
    tapMap: "Tap where you're sitting",
    whenTitle: "When?",
    preorderLabel: "Order for later today",
    submitBtn: "Pick a spot on the map",
    submitReady: "Send order",
    confirmTitle: "Order sent!",
    confirmBody: "Someone will bring your order to your spot shortly.",
    hrs: "hrs"
  },
  es: {
    brand: "Pedido de Playa",
    brandSub: "Sin caminar a buscar — pide desde tu lugar",
    whatDoYouWant: "¿Qué te gustaría?",
    whereAreYou: "¿Dónde estás?",
    tapMap: "Toca donde estás sentado",
    whenTitle: "¿Cuándo?",
    preorderLabel: "Pedir para más tarde hoy",
    submitBtn: "Elige un lugar en el mapa",
    submitReady: "Enviar pedido",
    confirmTitle: "¡Pedido enviado!",
    confirmBody: "Alguien llevará tu pedido a tu lugar en breve.",
    hrs: "hrs"
  }
};

function setLang(l){
  lang = l;
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnES').classList.toggle('active', l==='es');
  document.getElementById('brandText').childNodes[0].nodeValue = dict[l].brand;
  document.getElementById('brandSub').textContent = dict[l].brandSub;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.getAttribute('data-t');
    if(dict[l][key]) el.textContent = dict[l][key];
  });
  updateSubmitState();
  updateHours();
}

async function loadItems(){
  const { data, error } = await sb.from('items').select('*').order('sort_order');
  if(error){ console.error(error); return; }
  items = data;
  items.forEach(i => qtys[i.id] = 0);
  renderItems();
}

function renderItems(){
  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div>
        <div class="item-name">${item.name}</div>
        <div class="item-price">$${item.price} · ${item.available_qty} ${lang==='es' ? 'disponibles' : 'available'}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
        <div class="qty-num" id="qty-${item.id}">0</div>
        <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
      </div>
    `;
    list.appendChild(row);
  });
}

function changeQty(id, delta){
  const item = items.find(i=>i.id===id);
  let newQty = qtys[id] + delta;
  if(newQty < 0) newQty = 0;
  if(newQty > item.available_qty) newQty = item.available_qty;
  qtys[id] = newQty;
  document.getElementById(`qty-${id}`).textContent = newQty;
  updateTotal();
}

function updateTotal(){
  let total = 0;
  items.forEach(i => total += qtys[i.id] * i.price);
  document.getElementById('totalDisplay').textContent = `$${total}`;
  updateSubmitState();
}

function dropPin(lat, lng){
  mapLat = lat;
  mapLng = lng;
  if(!lmarker){
    lmarker = L.marker([lat, lng], { draggable:true }).addTo(lmap);
    lmarker.on('dragend', ()=>{
      const pos = lmarker.getLatLng();
      mapLat = pos.lat;
      mapLng = pos.lng;
      updateSubmitState();
    });
  } else {
    lmarker.setLatLng([lat, lng]);
  }
  updateSubmitState();
}

function initMap(defaultCenter){
  lmap = L.map('leafletMap', { zoomControl: true }).setView([defaultCenter.lat, defaultCenter.lng], 19);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(lmap);
  lmap.on('click', (e)=> dropPin(e.latlng.lat, e.latlng.lng));
}

function startMap(){
  const fallback = { lat: 21.4934, lng: -87.9954 }; // fallback: adjust to your beach's coordinates
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      (pos)=> initMap({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      ()=> initMap(fallback),
      { enableHighAccuracy:true, timeout:6000 }
    );
  } else {
    initMap(fallback);
  }
}

function togglePreorder(){
  isPreorder = document.getElementById('preorderToggle').checked;
  document.getElementById('preorderFields').style.display = isPreorder ? 'block' : 'none';
}

function updateHours(){
  const v = document.getElementById('hoursSlider').value;
  document.getElementById('hoursLabel').textContent = `${v} ${dict[lang].hrs}`;
}

function updateSubmitState(){
  const btn = document.getElementById('submitBtn');
  const hasItems = Object.values(qtys).some(q => q > 0);
  const hasSpot = mapLat !== null;
  if(hasItems && hasSpot){
    btn.disabled = false;
    btn.textContent = dict[lang].submitReady;
  } else {
    btn.disabled = true;
    btn.textContent = dict[lang].submitBtn;
  }
}

async function submitOrder(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '...';

  const orderedItems = items.filter(i => qtys[i.id] > 0);
  const total = orderedItems.reduce((sum,i)=> sum + qtys[i.id]*i.price, 0);
  const hours = isPreorder ? Number(document.getElementById('hoursSlider').value) : null;

  const { data: order, error } = await sb.from('orders').insert({
    map_lat: mapLat,
    map_lng: mapLng,
    is_preorder: isPreorder,
    hours_from_now: hours,
    total_price: total,
    status: 'pending'
  }).select().single();

  if(error){ console.error(error); btn.disabled=false; updateSubmitState(); return; }

  const lineItems = orderedItems.map(i => ({
    order_id: order.id,
    item_id: i.id,
    qty: qtys[i.id],
    price_each: i.price
  }));
  await sb.from('order_items').insert(lineItems);

  document.getElementById('orderView').style.display = 'none';
  document.getElementById('submitBar').style.display = 'none';
  document.getElementById('confirmView').style.display = 'block';
}

loadItems();
startMap();
setLang('en');
</script>
</body>
</html>
